
name: Deploy ASP.NET MVC

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      # 1. Download source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # 4. Restore NuGet packages
      - name: Restore NuGet Packages
        shell: pwsh
        run: |
          nuget restore "./ClassLateManage.csproj" `
            -PackagesDirectory "${{ github.workspace }}\..\packages"

      # 5. Build and Publish
      - name: Build and Publish
        shell: pwsh
        run: |
          msbuild "./ClassLateManage.csproj" `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:PublishUrl="${{ github.workspace }}\publish" `
            /p:DeleteExistingFiles=true

      # 6. Deploy published files to FTP
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: /
